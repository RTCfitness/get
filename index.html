<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get RTC Fitness - Free on iPhone and Android</title>
<meta name="description" content="Training, meals and progress in one app. Free on the App Store and Google Play.">
<link rel="icon" href="icon.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--o:#F78C26;--r:#C84040}*{box-sizing:border-box}
html,body{margin:0;min-height:100%}body{font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#fff;background:#0b0b0c}
.bg{position:fixed;inset:0;background:url(backdrop.jpg) center/cover;filter:saturate(.8)}
.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,9,.74) 0%,rgba(8,8,9,.66) 45%,rgba(8,8,9,.96) 100%),radial-gradient(60% 40% at 50% 0%,rgba(200,64,64,.28),transparent 70%)}
.w{position:relative;max-width:980px;margin:auto;padding:28px 20px 40px;display:grid;gap:28px;grid-template-columns:1fr;justify-items:center;text-align:center}
.brand{display:flex;align-items:center;gap:12px;justify-content:center}.brand img{width:44px;height:44px;border-radius:11px}
.brand b{letter-spacing:.2em;font-weight:800;font-size:14px;color:#cfd2d6}
h1{margin:0;font-weight:900;font-size:clamp(40px,9vw,76px);line-height:.98;letter-spacing:-.02em;text-transform:uppercase}h1 span{color:var(--o);display:block}
.sub{font-size:clamp(16px,2.6vw,20px);color:#d6d8dc;margin:14px 0 0}
.chip{display:inline-block;margin-top:16px;padding:8px 14px;border:1px solid rgba(247,140,38,.55);border-radius:999px;background:rgba(247,140,38,.12);font-weight:700;font-size:14px}
.chip em{font-style:normal;color:var(--o)}
.pick{font-weight:800;letter-spacing:.14em;font-size:12px;color:#aab;margin:26px 0 10px;text-transform:uppercase}
.btns{display:grid;gap:14px;width:min(420px,100%);margin:0 auto}
.btn{display:flex;align-items:center;gap:14px;text-align:left;text-decoration:none;color:#fff;background:#000;border:1.5px solid #a6a6a6;border-radius:14px;padding:12px 18px;transition:transform .15s,border-color .15s,box-shadow .15s}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);border-color:#fff;outline:none}
.btn svg{width:34px;height:34px;flex:none}.btn small{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#d0d0d0}
.btn strong{display:block;font-size:24px;font-weight:600;letter-spacing:-.01em;line-height:1.1}.btn .os{margin-left:auto;font-size:12px;font-weight:700;color:#9aa}
.btn.rec{border-color:var(--o);box-shadow:0 0 0 3px rgba(247,140,38,.25),0 10px 30px rgba(247,140,38,.18)}
.btn.rec .os{color:var(--o)}
.trust{margin-top:16px;font-size:13px;color:#a9adb3}
.phone{display:none}.phone img{width:260px;border-radius:34px;box-shadow:0 30px 70px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08)}
@media(min-width:860px){.w{grid-template-columns:1.15fr .85fr;text-align:left;align-items:center;min-height:100vh;gap:40px}.brand{justify-content:flex-start}.btns{margin:0}.phone{display:block}}
</style></head><body><div class="bg"></div>
<main class="w"><section>
<div class="brand"><img src="icon.png" alt="RTC Fitness icon"><b>RTC FITNESS</b></div>
<h1 style="margin-top:22px">Your goal.<span>Your plan.</span></h1>
<p class="sub">Training, meals and progress in one app. Free to download.</p>
<div class="chip">Launch offer: 14 days Pro free with code <em>RTCLAUNCH</em></div>
<p class="pick">Choose your phone</p>
<div class="btns">
<a class="btn" id="and" href="#"><svg viewBox="0 0 512 512" aria-hidden="true"><path fill="#00D7FE" d="M48 59.5v393c0 7 4 13 10 16.2L275 256z"/><path fill="#00F076" d="M333 313.9L275 256l58-57.9L82 56c-6-3.3-13-3.6-19.5-.5z" transform="translate(0 0)"/><path fill="#FF3A44" d="M333 198.1L275 256l58 57.9 112-63c11-6.3 11-18.9 0-25.2z" transform="translate(0 0)"/><path fill="#FFD500" d="M275 256L58.5 468.7c6.3 3.2 13.7 2.8 20-1.2l254.5-153.6z"/></svg><span><small>Get it on</small><strong>Google Play</strong></span><span class="os">ANDROID</span></a>
<a class="btn" id="ios" href="#"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#fff" d="M17.05 20.28c-.98.95-2.05.8-3.08.35-1.09-.46-2.09-.48-3.24 0-1.44.62-2.2.44-3.06-.35C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09l.01-.01zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.29 2.58-2.34 4.5-3.74 4.25z"/></svg><span><small>Download on the</small><strong>App Store</strong></span><span class="os">IPHONE</span></a>
</div>
<p class="trust">171+ workouts · 984 meals · Free to start</p>
</section>
<aside class="phone"><img src="phone.jpg" alt="RTC Fitness home screen"></aside></main>
<script>
/* Links carry the traffic source so the stores can report it.
   Bio link examples:  /go/?s=ig   /go/?s=tt   /go/?s=yt   /go/?s=fb   ads: ?s=meta&v=RTC-V01-HOOK or ?s=google
   Fill APPLE_PT (App Store Connect provider token) to switch on iPhone campaign reporting. */
var APPLE_ID="6818820831",PKG="com.richtrimcoaching.rtc",APPLE_PT="";
var q=new URLSearchParams(location.search),s=(q.get("s")||"bio").replace(/[^a-z0-9_-]/gi,"").slice(0,20),v=(q.get("v")||"").replace(/[^A-Za-z0-9_-]/g,"").slice(0,40),paid=/^(meta|google)$/.test(s);
var utm="utm_source="+s+"&utm_medium="+(paid?"paid":"organic")+"&utm_campaign=rtc-oct26"+(v?"&utm_content="+v:"");
var play="https://play.google.com/store/apps/details?id="+PKG+"&referrer="+encodeURIComponent(utm);
var ios="https://apps.apple.com/app/id"+APPLE_ID+(APPLE_PT?"?pt="+APPLE_PT+"&ct="+encodeURIComponent(s+(v?"_"+v:"")):"");
document.getElementById("and").href=play;document.getElementById("ios").href=ios;
var ua=navigator.userAgent,isI=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1),isA=/Android/.test(ua);
var r=document.getElementById(isI?"ios":isA?"and":"");if(r){r.classList.add("rec");r.querySelector(".os").textContent="FOR YOUR PHONE";r.parentNode.insertBefore(r,r.parentNode.firstChild)}
</script></body></html>
